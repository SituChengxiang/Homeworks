<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>反轴 n̄ · 等效点系与它的两种画法</title>
<style>
  /* 页面骨架。颜色、字号、间距一律来自 design/tokens.css 的 --u 与语义色，这里只写布局。 */
  body { margin: 0; background: var(--c-bg); color: var(--c-txt); overflow: hidden; }

  /* 16:9 锁定：窗口比例不对就留黑边，投出去永远就是设计时那张构图 */
  #frame { width: 100vw; height: 100vh; display: grid; place-items: center; background: #000; }
  #stage {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    background: radial-gradient(120% 140% at 22% -20%, #14203a 0%, var(--c-stage) 60%);
    display: grid;
    grid-template-columns: 1.34fr 1fr;
    grid-template-rows: 1fr auto auto;
    gap: var(--sp-2); padding: var(--sp-2);
    position: relative;
  }

  .pane { position: relative; min-height: 0; border-radius: var(--r-2); overflow: hidden; }
  #view3d { grid-column: 1; grid-row: 1; background: rgba(6, 11, 22, .55); border: 1px solid var(--c-line); }
  #view2d {
    grid-column: 2; grid-row: 1; background: rgba(6, 11, 22, .78);
    border: 1px solid var(--c-line); border-left: calc(var(--u) * .34) solid var(--c-accent);
  }
  /* 教材俯视图缩成角标：它是对照物，不是主角，但必须在场。
     放右下角 —— 标题与结论写在顶部，两者在结构上就不可能叠到一起。 */
  #inset {
    position: absolute; right: var(--sp-2); bottom: var(--sp-2);
    width: 36%; aspect-ratio: 1 / 1;
    background: rgba(4, 8, 16, .82); border: 1px solid var(--c-line);
    border-radius: var(--r-1); overflow: hidden;
  }
  #inset .tag {
    position: absolute; left: calc(var(--u) * .8); top: calc(var(--u) * .6);
    font-size: var(--fs-note); color: var(--c-muted); pointer-events: none;
  }

  /* ---------- 字幕条：两端就是翻页，中间是这一步要说的话 ---------- */
  #caption {
    grid-column: 1 / -1; grid-row: 2;
    display: grid; grid-template-columns: auto 1fr auto; align-items: center;
    gap: var(--sp-2);
    background: var(--c-panel); border: 1px solid var(--c-line);
    border-left: calc(var(--u) * .45) solid var(--c-accent);
    border-radius: var(--r-2); padding: var(--sp-1) var(--sp-2);
  }
  .nav {
    appearance: none; cursor: pointer; white-space: nowrap;
    background: rgba(34, 211, 238, .1); color: #d8fbff;
    border: 1px solid rgba(34, 211, 238, .42); border-radius: var(--r-1);
    padding: var(--sp-1) var(--sp-2); font-size: var(--fs-body); font-weight: 600;
    display: flex; align-items: center; gap: calc(var(--u) * .7);
  }
  .nav:hover:not(:disabled) { background: rgba(34, 211, 238, .22); border-color: var(--c-accent); }
  .nav:disabled { opacity: .3; cursor: default; }
  .nav .arrow { font-size: var(--fs-caption); line-height: 1; }
  .nav .peek { color: var(--c-muted); font-weight: 500; font-size: var(--fs-note); }
  #capText { text-align: center; line-height: 1.3; min-width: 0; }
  #capIdx { font-size: var(--fs-note); color: var(--c-accent); letter-spacing: .1em; }
  /* 标题一行放不下就省略：宁可少看几个字，也不能让字幕条把画面挤扁 */
  #capTitle { font-size: var(--fs-caption); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #capNote { font-size: var(--fs-body); color: #b9c6e2; }

  /* ---------- 分段进度轨：每段一个关键词，点哪段跳哪段 ---------- */
  #rail {
    grid-column: 1 / -1; grid-row: 3;
    display: grid; gap: calc(var(--u) * .5);
    align-items: start; padding: 0 var(--sp-1) var(--sp-1);
  }
  .seg {
    appearance: none; cursor: pointer; background: none; border: 0; padding: 0;
    color: var(--c-muted); font-size: var(--fs-note); text-align: left; white-space: nowrap;
    display: flex; flex-direction: column; gap: calc(var(--u) * .45);
  }
  .seg i { display: block; height: calc(var(--u) * .5); border-radius: 99px; background: rgba(126,150,200,.26); }
  .seg:hover { color: var(--c-txt); }
  .seg:hover i { background: rgba(34,211,238,.45); }
  .seg.done i { background: rgba(126,150,200,.55); }
  .seg.now { color: #d8fbff; font-weight: 700; }
  .seg.now i { background: var(--c-accent); box-shadow: 0 0 calc(var(--u)*1.2) rgba(34,211,238,.7); }

  /* ---------- 抽屉：图层与数据表，讲到再拉出来 ---------- */
  .drawer h3 { margin-top: var(--sp-3); }
  .drawer h3:first-child { margin-top: 0; }
  .sw { display: flex; align-items: center; justify-content: space-between; padding: calc(var(--u)*.7) 0; font-size: var(--fs-body); }
  .sw input { display: none; }
  .sw .tk { width: calc(var(--u)*4.4); height: calc(var(--u)*2.4); border-radius: 99px; background: rgba(255,255,255,.14); position: relative; transition: .16s; flex: 0 0 auto; }
  .sw .tk::after { content: ""; position: absolute; top: calc(var(--u)*.4); left: calc(var(--u)*.4); width: calc(var(--u)*1.6); height: calc(var(--u)*1.6); border-radius: 50%; background: #cbd5e1; transition: .16s; }
  .sw input:checked + .tk { background: rgba(34,211,238,.55); }
  .sw input:checked + .tk::after { left: calc(var(--u)*2.4); background: #eafeff; }
  .sw label { cursor: pointer; }
  .keys { font-size: var(--fs-note); color: var(--c-muted); line-height: 1.9; }
  .keys b { color: #cdeff7; font-weight: 600; }

  #badge {
    position: absolute; left: var(--sp-2); top: var(--sp-2);
    font-size: var(--fs-note); color: #a8eef7; background: rgba(8,12,24,.55);
    border: 1px solid var(--c-line); padding: calc(var(--u)*.5) calc(var(--u)*1.1);
    border-radius: 99px; pointer-events: none;
  }

  /* 纯净模式：只留画面、字幕与进度轨 */
  body.clean .drawer { display: none; }
</style>
</head>
<body>
<div id="frame">
  <div id="stage">
    <div class="pane" id="view3d"><canvas id="scene"></canvas><div id="badge">3D</div></div>

    <div class="pane" id="view2d">
      <canvas id="fan"></canvas>
      <div id="inset"><span class="tag">教材俯视图</span><canvas id="top"></canvas></div>
    </div>

    <div id="caption">
      <button class="nav" id="prev"><span class="arrow">◀</span><span>上一步</span></button>
      <div id="capText">
        <div id="capIdx">—</div>
        <div id="capTitle">—</div>
        <div id="capNote">—</div>
      </div>
      <button class="nav" id="next"><span id="nextPeek" class="peek"></span><span>下一步</span><span class="arrow">▶</span></button>
    </div>

    <div id="rail"></div>

    <aside class="drawer" id="layers"></aside>
    <aside class="drawer" id="data"></aside>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
